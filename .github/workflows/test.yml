name: 测试

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Windows：全部测试用的假工具是 sh 脚本，在 Windows 上跑不了；这里只编译，跑按 Windows 规矩写的那几项和英文表
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 一个文件一个文件跑、逐项打印；一项最多 60 秒，测完强制退出（有没关的句柄也不会一直挂着）
      - run: node --test --test-reporter=spec --test-timeout=60000 --test-force-exit dist/test/windows.test.js
      - run: node --test --test-reporter=spec --test-timeout=60000 --test-force-exit dist/test/i18n.test.js
      # 建快照仓库先建在旁边再挪过去：Windows 上挪文件夹的规矩不一样（杀毒软件会占着刚建的文件）
      - run: node --test --test-reporter=spec --test-timeout=60000 --test-force-exit dist/test/snap-race.test.js
      # 安装脚本在 Windows 自带的 PowerShell 5 里读得通（写错一个括号，双击安装就整个装不上）
      - name: 安装脚本的语法
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/windows/install.ps1'), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
