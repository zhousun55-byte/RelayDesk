name: 测试

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Windows：全部测试用的假工具是 sh 脚本，在 Windows 上跑不了；这里只编译，跑按 Windows 规矩写的那几项和英文表
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 一个文件一个文件跑、逐项打印；一项最多 60 秒，测完强制退出（有没关的句柄也不会一直挂着）
      - run: node --test --test-reporter=spec --test-timeout=60000 --test-force-exit dist/test/windows.test.js
      - run: node --test --test-reporter=spec --test-timeout=60000 --test-force-exit dist/test/i18n.test.js
