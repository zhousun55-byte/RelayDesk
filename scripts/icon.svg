<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 接力台的图标：一条线路，上面一站（交出去），下面一站（接住了）。和网页里的线路一个样子。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#151515" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#151515" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M512 380v262" stroke="#151515" stroke-width="44" stroke-linecap="round"/>
  <circle cx="512" cy="330" r="74" fill="#fafaf9" stroke="#151515" stroke-width="40"/>
  <circle cx="512" cy="694" r="86" fill="#151515"/>
</svg>
