<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    接力台的图标：换乘。一条线在换乘站（胶囊）换了一种颜色接着走——换一个 AI 接着做；
    灰色那段旁边一颗红点（弱模型的活，待复核），终点实心打勾（验收通过）。纸是网页里的点阵纸。
    改了这个文件，要重新画 scripts/icon.png（1024 像素、透明底；用浏览器画，快速查看画出来是白底）。
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfc"/>
      <stop offset="1" stop-color="#f2f2ef"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse" x="100" y="100">
      <circle cx="24" cy="24" r="3.4" fill="#151515" fill-opacity="0.11"/>
    </pattern>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#151515" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#151515" stroke-opacity="0.08"/>
  <path d="M372 262V512" stroke="#151515" stroke-width="30" stroke-linecap="round"/>
  <path d="M652 512V744" stroke="#8f8f8b" stroke-width="30" stroke-linecap="round"/>
  <circle cx="372" cy="262" r="50" fill="#fcfcfb" stroke="#151515" stroke-width="16"/>
  <rect x="316" y="460" width="392" height="104" rx="52" fill="#fcfcfb" stroke="#151515" stroke-width="16"/>
  <circle cx="724" cy="632" r="17" fill="#cb2f29"/>
  <circle cx="652" cy="756" r="70" fill="#151515"/>
  <path d="M620 758 L642 781 L686 731" fill="none" stroke="#fcfcfb" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
